[package]
name = "magnetic-encoder"
version = "0.1.0"
edition = "2021"
description = "Typed CAN 2.0/CANopen protocol and monitoring library for Hex magnetic encoders."
license = "MIT OR Apache-2.0"

[dependencies]
can-transport = { version = "0.1.3", default-features = false }
thiserror = "1"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }

[dev-dependencies]
async-trait = "0.1"
